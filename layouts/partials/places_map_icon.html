<svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><path d="M12 1.8l3.1 6.5 7.1.9-5.2 4.9 1.3 7.1L12 17.7l-6.3 3.5 1.3-7.1L1.8 9.2l7.1-.9z" fill="#1a5fd0" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
