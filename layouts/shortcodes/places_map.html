{{/* Leaflet map of the `places` list in the current page's front matter.
     Each place needs: name, location, lat, lng. Usage: {{< places_map >}} */}}
{{ $places := .Page.Params.places }}
{{ $id := printf "places-map-%d" .Ordinal }}
{{ with $places }}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
      integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
      crossorigin="anonymous" referrerpolicy="no-referrer">
<div id="{{ $id }}" class="places-map" role="img" aria-label="Map of places: {{ delimit (apply . "index" "." "name") ", " }}"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
        integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
  (function () {
    var places = {{ . | jsonify | safeJS }};
    var map = L.map("{{ $id }}", { scrollWheelZoom: false, worldCopyJump: true });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var markers = places.map(function (p) {
      return L.circleMarker([p.lat, p.lng], {
        radius: 7,
        color: "#ffffff",
        weight: 2,
        fillColor: "#00a933",
        fillOpacity: 1
      })
        .bindTooltip("<strong>" + p.name + "</strong><br>" + p.location, { direction: "top", offset: [0, -6] })
        .addTo(map);
    });

    map.fitBounds(L.featureGroup(markers).getBounds(), { padding: [30, 30] });
  })();
</script>
{{ end }}
